services:
  # Redis Cache - no changes needed
  redis:
    image: redis/redis-stack:latest
    container_name: rag_chat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rag_chat_network

volumes:
  redis_data:
    name: redis_data

networks:
  rag_chat_network:
    driver: bridge
